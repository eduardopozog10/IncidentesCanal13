{% extends "incidents/users/base.html" %}
{% block user_content %}<section class="panel user-panel user-form-panel"><h2>Cambiar mi contraseña</h2><form method="post" class="user-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="user-field">{{ field.label_tag }}{{ field }}{{ field.errors }}<small class="user-help">{{ field.help_text }}</small></div>{% endfor %}<button class="user-button" type="submit">Actualizar contraseña</button></form></section>{% endblock %}
